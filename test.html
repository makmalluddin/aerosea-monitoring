<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desain UI Integrasi Panel Detail</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background-color: #e5e7eb;
      background-image: radial-gradient(#cbd5e1 1px, transparent 1px);
      background-size: 20px 20px;
    }
    /* Kustomisasi scrollbar tipis */
    .custom-scrollbar::-webkit-scrollbar { width: 4px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
  </style>
</head>
<body class="h-screen w-screen overflow-hidden relative font-sans">

  <!-- LAJUR KANAN: Tempat semua panel kanan berkumpul -->
  <div class="absolute top-6 right-6 z-[1000] w-80 flex flex-col gap-4 max-h-[calc(100vh-120px)]">
    
    <!-- CARD 1: PANEL KONTROL (Selalu Ada) -->
    <div class="bg-white/90 backdrop-blur-md border border-gray-200 p-4 rounded-xl shadow-lg shrink-0">
      <div class="flex justify-between items-center mb-4">
        <h2 class="text-lg font-bold text-gray-800">Mode Kapal Laut</h2>
        <span id="live-indicator" class="flex h-3 w-3">
          <span class="animate-ping absolute inline-flex h-3 w-3 rounded-full bg-green-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-3 w-3 bg-green-500"></span>
        </span>
      </div>

      <div class="flex bg-gray-100 p-1 rounded-lg mb-4">
        <button class="flex-1 py-1.5 text-sm font-semibold rounded-md bg-white text-green-600 shadow-sm transition-all">Live</button>
        <button class="flex-1 py-1.5 text-sm font-semibold rounded-md text-gray-500 hover:text-gray-900 transition-all">Historis</button>
      </div>

      <button class="w-full flex justify-center items-center gap-2 bg-green-50 text-green-600 border border-green-200 hover:bg-green-600 hover:text-white px-4 py-2 rounded-lg text-sm font-semibold transition-colors">
        Hubungkan Server
      </button>
    </div>

    <!-- CARD 2: PANEL DETAIL (Muncul saat marker diklik) -->
    <!-- Diberi flex-1 min-h-0 agar bisa menyusut dan discroll jika layar kecil -->
    <div class="bg-white/95 backdrop-blur-md border border-gray-200 rounded-xl shadow-lg flex flex-col flex-1 min-h-0">
      
      <!-- Header Detail -->
      <div class="bg-blue-50/50 border-b border-gray-200 p-3 flex justify-between items-center rounded-t-xl shrink-0">
        <h3 class="font-bold text-sm text-blue-800">Detail Entitas</h3>
        <button class="text-gray-400 hover:text-red-500 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
        </button>
      </div>

      <!-- Isi Data (Bisa di-scroll) -->
      <div class="p-4 overflow-y-auto custom-scrollbar flex flex-col gap-3">
        <div class="flex flex-col border-b border-gray-100 pb-2">
          <span class="text-[10px] text-gray-500 uppercase tracking-wider font-semibold">MMSI / Callsign</span>
          <span class="text-sm font-bold text-gray-900">525119038</span>
        </div>
        <div class="flex flex-col border-b border-gray-100 pb-2">
          <span class="text-[10px] text-gray-500 uppercase tracking-wider font-semibold">Kecepatan (Knots)</span>
          <span class="text-sm font-medium text-gray-800">14.2</span>
        </div>
        <div class="flex flex-col border-b border-gray-100 pb-2">
          <span class="text-[10px] text-gray-500 uppercase tracking-wider font-semibold">Heading / Arah</span>
          <span class="text-sm font-medium text-gray-800">128° (Tenggara)</span>
        </div>
        <div class="flex flex-col border-b border-gray-100 pb-2">
          <span class="text-[10px] text-gray-500 uppercase tracking-wider font-semibold">Koordinat</span>
          <span class="text-sm font-medium text-gray-800 font-mono">-6.1202, 106.6508</span>
        </div>
        <div class="flex flex-col border-b border-gray-100 pb-2">
          <span class="text-[10px] text-gray-500 uppercase tracking-wider font-semibold">Status Navigasi</span>
          <span class="text-sm font-medium text-green-600">Under way using engine</span>
        </div>
      </div>

    </div>
  </div>

  <!-- PANEL TIMELINE (Tetap di posisinya) -->
  <div class="absolute bottom-10 left-1/2 -translate-x-1/2 w-[90%] max-w-3xl bg-white/90 backdrop-blur-sm border border-gray-200 p-4 rounded-xl shadow-lg opacity-50 pointer-events-none">
    <!-- Konten timeline disembunyikan agar fokus ke panel kanan -->
    <div class="text-center text-sm text-gray-400 font-medium">(Timeline Slider Area)</div>
  </div>

</body>
</html>
