<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radar Aerosea - Live Data Test</title>
    <!-- Tarik library Socket.io klien dari internet -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e1e1e;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            gap: 20px;
        }
        .panel {
            flex: 1;
            background-color: #2d2d2d;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 {
            margin-top: 0;
            border-bottom: 2px solid #444;
            padding-bottom: 10px;
        }
        button {
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 10px;
            transition: opacity 0.2s;
        }
        button:hover { opacity: 0.8; }
        .btn-start { background-color: #4CAF50; color: white; }
        .btn-stop { background-color: #f44336; color: white; }
        
        .log-box {
            background-color: #000000;
            color: #00ff00; /* Warna hijau ala terminal/radar */
            font-family: monospace;
            height: 60vh;
            overflow-y: auto;
            padding: 15px;
            margin-top: 15px;
            border-radius: 4px;
            border: 1px solid #555;
        }
        pre {
            margin: 0 0 10px 0;
            border-bottom: 1px dashed #333;
            padding-bottom: 10px;
            white-space: pre-wrap; /* Agar teks panjang tidak tembus ke kanan */
            word-wrap: break-word;
        }
    </style>
</head>
<body>

    <!-- Panel Kapal -->
    <div class="panel">
        <h2>🚢 Telemetri Kapal (AIS)</h2>
        <button class="btn-start" onclick="gabung('ship-room')">▶️ Mulai Streaming</button>
        <button class="btn-stop" onclick="keluar('ship-room')">⏸️ Hentikan</button>
        <div id="log-kapal" class="log-box">Menunggu instruksi...</div>
    </div>

    <!-- Panel Pesawat -->
    <div class="panel">
        <h2>✈️ Telemetri Pesawat (OpenSky)</h2>
        <button class="btn-start" onclick="gabung('aircraft-room')">▶️ Mulai Streaming</button>
        <button class="btn-stop" onclick="keluar('aircraft-room')">⏸️ Hentikan</button>
        <div id="log-pesawat" class="log-box">Menunggu instruksi...</div>
    </div>

    <script>
        // 1. Koneksi ke backend Aerosea Anda
        const socket = io('http://localhost:5000'); 

        // Fungsi untuk mengontrol ruangan
        function gabung(ruangan) {
            socket.emit('join-room', ruangan);
            document.getElementById(ruangan === 'ruang-kapal' ? 'log-kapal' : 'log-pesawat')
                .innerHTML = `<div style="color: yellow;">Meminta akses ke ${ruangan}...</div>`;
        }

        function keluar(ruangan) {
            socket.emit('leave-room', ruangan);
            document.getElementById(ruangan === 'ruang-kapal' ? 'log-kapal' : 'log-pesawat')
                .innerHTML += `<div style="color: red;">Streaming dihentikan.</div>`;
        }

        // 2. Tangkap data Kapal
        socket.on('ship-pipe', (data) => {
            const div = document.getElementById('log-kapal');
            // Ubah Object ke JSON teks yang rapi
            const teksData = JSON.stringify(data, null, 2); 
            div.innerHTML += `<pre>${teksData}</pre>`;
            div.scrollTop = div.scrollHeight; // Auto-scroll ke bawah
        });

        // 3. Tangkap data Pesawat
        socket.on('aircraft-pipe', (data) => {
            const div = document.getElementById('log-pesawat');
            const teksData = JSON.stringify(data, null, 2);
            div.innerHTML += `<pre>${teksData}</pre>`;
            div.scrollTop = div.scrollHeight;
        });

        // Pantau status koneksi umum
        socket.on('connect', () => {
            console.log('✅ Terhubung ke Server Aerosea');
        });
        socket.on('disconnect', () => {
            console.log('❌ Terputus dari server');
        });
    </script>
</body>
</html>
